$('toggleIntro').addEventListener('click',()=>{const expanded=$('intro').classList.toggle('description-expanded');$('toggleIntro').setAttribute('aria-expanded',String(expanded));$('toggleIntro').textContent=expanded?'收起说明':'展开说明';if(viewMode!=='custom')fitGraph(viewMode==='all');scheduleBubblePosition();});
document.addEventListener('pointerdown',event=>{if(!bubbleOpen||$('diffDialog').open||$('nodeBubble').contains(event.target)||event.target.closest('.graph-node'))return;closeBubble(true);});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&bubbleOpen&&!$('diffDialog').open){event.preventDefault();closeBubble(true);}});
$('graphScroll').addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0||event.target.closest('.graph-node'))return;panState={x:event.clientX,y:event.clientY,panX,panY,moved:false,pointer:event.pointerId};});
$('graphScroll').addEventListener('pointermove',event=>{if(!panState)return;const dx=event.clientX-panState.x,dy=event.clientY-panState.y;if(!panState.moved&&Math.hypot(dx,dy)<5)return;panState.moved=true;$('graphScroll').classList.add('is-panning');$('graphScroll').setPointerCapture(event.pointerId);const next=computePan(panState,dx,dy);setPan(next.panX,next.panY);event.preventDefault();});
function endPan(){if(panState&&panState.moved){suppressCanvasClick=true;setTimeout(()=>{suppressCanvasClick=false;},0);}panState=null;$('graphScroll').classList.remove('is-panning');}
$('graphScroll').addEventListener('pointerup',endPan);$('graphScroll').addEventListener('pointercancel',endPan);$('graphScroll').addEventListener('pointerleave',event=>{if(panState&&!panState.moved)endPan();});$('graphScroll').addEventListener('click',event=>{if(suppressCanvasClick)return;if(!event.target.closest('.graph-node'))closeBubble(true);});$('graphScroll').addEventListener('scroll',adoptNativeScroll,{passive:true});
$('graphScroll').addEventListener('wheel',onCanvasWheel,{passive:false});
$('graphScroll').addEventListener('keydown',onCanvasKeyDown);
$('diffDialog').addEventListener('click',event=>{if(event.target===$('diffDialog')){const r=$('diffDialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('diffDialog').close();}});
window.addEventListener('beforeunload',guardUnsaved);
window.addEventListener('blur',clearRelationPreview);
window.addEventListener('resize',()=>{if(!$('graphView').classList.contains('hidden')&&viewMode!=='custom')fitGraph(viewMode==='all');scheduleBubblePosition();});window.addEventListener('scroll',scheduleBubblePosition,{passive:true,capture:true});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(scheduleBubblePosition).observe($('nodeBubble'));
initializeView();
</script>
